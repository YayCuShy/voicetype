[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetype"
version = "0.4.2"
description = "Minimal offline voice dictation daemon for Linux/Wayland"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voicetype = "voicetype.__main__:main"

[tool.setuptools]
packages = ["voicetype"]
